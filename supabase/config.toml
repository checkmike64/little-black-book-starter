# Local-only Supabase stack. Never put hosted project credentials in this file.
# Regenerate/review with the pinned Supabase CLI when the CLI version changes.
project_id = "little-black-book"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Keep local migration verification aligned with the authoritative project.
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"
